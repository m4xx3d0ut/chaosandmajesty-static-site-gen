---
- name: Ensure application directory exists
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: '0755'

- name: Prepare runtime group metadata
  include_tasks:
    file: runtime_group.yml

- name: Ensure nginx auth directory exists with runtime permissions
  file:
    path: "{{ auth_file_host_path }}"
    state: directory
    owner: root
    group: "{{ container_runtime_group_effective | default(container_runtime_group) }}"
    mode: '0750'
  when: auth_file_host_path | default('') | length > 0

- name: Gather nginx auth files
  find:
    paths: "{{ auth_file_host_path }}"
    file_type: file
    recurse: false
  register: auth_files
  when: auth_file_host_path | default('') | length > 0

- name: Ensure nginx auth files inherit runtime permissions
  file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ container_runtime_group_effective | default(container_runtime_group) }}"
    mode: '0640'
  loop: "{{ auth_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - auth_file_host_path | default('') | length > 0
    - auth_files is defined
    - (auth_files.files | default([])) | length > 0

- name: Ensure WebDAV directory exists on host
  file:
    path: "{{ webdav_host_path }}"
    state: directory
    owner: root
    group: root
    mode: '0775'
  when: webdav_mount_enabled | bool

- name: Ensure ACME webroot exists on host
  file:
    path: "{{ acme_webroot_host_path }}/.well-known/acme-challenge"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: letsencrypt_mount_enabled | bool

- name: Prepare Let's Encrypt permissions
  include_tasks:
    file: letsencrypt.yml
  vars:
    letsencrypt_runtime_files:
      - path: "{{ letsencrypt_host_path }}/live/{{ letsencrypt_primary_domain }}/fullchain.pem"
        mode: '0640'
      - path: "{{ letsencrypt_host_path }}/live/{{ letsencrypt_primary_domain }}/privkey.pem"
        mode: '0640'
      - path: "{{ letsencrypt_host_path }}/options-ssl-nginx.conf"
        mode: '0644'
      - path: "{{ letsencrypt_host_path }}/ssl-dhparams.pem"
        mode: '0644'
  when: letsencrypt_mount_enabled | bool

- name: Render docker-compose configuration
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: '0640'

- name: Record desired image reference
  copy:
    dest: "{{ app_dir }}/.current-image"
    content: "{{ image_ref }}\n"
    owner: "{{ app_owner }}"
    group: "{{ app_group }}"
    mode: '0640'

- name: Authenticate to container registry (optional)
  community.docker.docker_login:
    registry_url: "{{ image_registry }}"
    username: "{{ registry_username }}"
    password: "{{ registry_password }}"
  when: registry_login | bool

- name: Pull deployment image explicitly
  community.docker.docker_image:
    name: "{{ image_ref }}"
    source: pull
    force_source: true

- name: Validate rss-proxy site output path
  ansible.builtin.assert:
    that:
      - app_dir is defined
      - site_output_host_path is defined
      - site_output_host_path | length > 1
      - site_output_host_path != '/'
      - site_output_host_path != app_dir
      - site_output_host_path.startswith(app_dir ~ '/')
    fail_msg: "site_output_host_path must be a subdirectory of app_dir ({{ app_dir }})"
  when: rss_proxy_enabled | bool

- name: Refresh site-output from image for rss-proxy
  shell: |
    set -euo pipefail
    tmp_container=""
    tmp_container="$(docker create "{{ image_ref }}")"
    trap 'docker rm -f "$tmp_container" >/dev/null 2>&1 || true' EXIT
    rm -rf "{{ site_output_host_path }}"
    mkdir -p "{{ site_output_host_path }}"
    docker cp "${tmp_container}:/usr/share/nginx/html/." "{{ site_output_host_path }}/"
  args:
    executable: /bin/bash
  when: rss_proxy_enabled | bool

- name: Pull rss-proxy image explicitly
  community.docker.docker_image:
    name: "{{ rss_proxy_image_ref }}"
    source: pull
    force_source: true
  when: rss_proxy_enabled | bool

- name: Stop host nginx service if requested
  service:
    name: "{{ host_nginx_service_name }}"
    state: stopped
    enabled: false
  when: disable_host_nginx | bool

- name: Apply compose project
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    pull: never
    recreate: always
    remove_orphans: true
    state: present

- name: Probe container health endpoint
  uri:
    url: "http://{{ healthcheck_address }}:{{ healthcheck_port }}{{ healthcheck_path }}"
    status_code: 200
    timeout: 10
    return_content: false
  register: healthcheck_response
  retries: 5
  delay: 5
  until: healthcheck_response.status == 200
