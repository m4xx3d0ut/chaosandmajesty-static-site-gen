---
# Global defaults for the deployment role. Override per-environment using
# inventory variables or extra vars in CI.
app_dir: /opt/chaosandmajesty
compose_project_name: chaosandmajesty
compose_service_name: cm_site
compose_container_name: cm-prod
http_bind_interface: 0.0.0.0
https_bind_interface: 0.0.0.0
listen_port: 8080
listen_port_ssl: 8443
healthcheck_address: 127.0.0.1
healthcheck_port: 80
app_owner: deploy
app_group: deploy

# Business site (IPv6-only origin)
business_enabled: true
business_compose_service_name: cm_business
business_container_name: cm-business
business_image_name: "{{ image_name }}-business"
business_image_tag: "{{ image_tag }}"
business_https_bind_interface: "[2600:3c01:e000:b53::10]"
business_listen_port_ssl: 8443
business_healthcheck_path: /health
business_mem_limit: 256m
business_mem_reservation: 128m
business_cpus: "0.50"
business_pids_limit: 256
business_letsencrypt_mount_enabled: true

# Container runtime UID/GID (matches nginx-unprivileged base image)
container_runtime_group: cm_nginx_runtime
container_runtime_uid: 101
container_runtime_gid: 101

# Resource limits (baseline defaults; override per-environment if needed)
cm_mem_limit: 256m
cm_mem_reservation: 128m
cm_cpus: "0.50"
cm_pids_limit: 256

rss_proxy_mem_limit: 512m
rss_proxy_mem_reservation: 256m
rss_proxy_cpus: "0.50"
rss_proxy_pids_limit: 256

# Container image reference (registry/namespace/name:tag)
image_registry: ghcr.io
image_namespace: chaosandmajesty
image_name: cm-site
image_tag: prod

# RSS proxy (SSE) companion service
rss_proxy_enabled: true
rss_proxy_image_name: rss-proxy
rss_proxy_image_tag: "{{ image_tag }}"
rss_proxy_container_name: cm-rss-proxy
rss_proxy_port: 7070
rss_proxy_refresh_interval: 600000
rss_proxy_config_path: /app/smoke-test.yaml
rss_proxy_output_dir: /app/site-output
site_output_host_path: "{{ app_dir }}/site-output"

# Registry credentials (optional). Leave blank for public images.
registry_username: ''
registry_password: ''
registry_login: "{{ (registry_username | length) > 0 and (registry_password | length) > 0 }}"

# Disable host nginx once container is serving traffic
disable_host_nginx: true
host_nginx_service_name: nginx

# WebDAV mount keeps host /var/www/html/dav available to Nginx.
webdav_mount_enabled: true
webdav_host_path: /var/www/html/dav
webdav_container_path: /usr/share/nginx/html/dav

# Let's Encrypt certificates and ACME challenge sharing
letsencrypt_mount_enabled: true
letsencrypt_host_path: /etc/letsencrypt
letsencrypt_container_path: /etc/letsencrypt
acme_webroot_host_path: /var/www/letsencrypt
acme_webroot_container_path: /var/www/letsencrypt
# Optional archive permission sweep can be expensive on hosts with long cert history.
letsencrypt_archive_permission_sweep_enabled: false
letsencrypt_primary_domain: chaosandmajesty.com
letsencrypt_domains:
  - chaosandmajesty.com
  - cosmosmechane.com

# Optional mount for sharing an nginx auth file with the container.
auth_file_host_path: /etc/nginx/auth
auth_file_container_path: /etc/nginx/auth

# Healthcheck path exposed by the container
healthcheck_path: /health

# Git frontend artifacts ship with the static site build; no external mirror required.
