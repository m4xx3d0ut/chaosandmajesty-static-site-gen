---
# Global defaults for the deployment role. Override per-environment using
# inventory variables or extra vars in CI.
app_dir: /opt/chaosandmajesty
compose_project_name: chaosandmajesty
compose_service_name: cm_site
compose_container_name: cm-prod
http_bind_interface: 0.0.0.0
https_bind_interface: 0.0.0.0
listen_port: 8080
listen_port_ssl: 8443
healthcheck_address: 127.0.0.1
healthcheck_port: 80
app_owner: deploy
app_group: deploy

# Container image reference (registry/namespace/name:tag)
image_registry: ghcr.io
image_namespace: chaosandmajesty
image_name: cm-site
image_tag: prod

# Registry credentials (optional). Leave blank for public images.
registry_username: ''
registry_password: ''
registry_login: "{{ (registry_username | length) > 0 and (registry_password | length) > 0 }}"

# Disable host nginx once container is serving traffic
disable_host_nginx: true
host_nginx_service_name: nginx

# WebDAV mount keeps host /var/www/html/dav available to Nginx.
webdav_mount_enabled: true
webdav_host_path: /var/www/html/dav
webdav_container_path: /usr/share/nginx/html/dav

# Let's Encrypt certificates and ACME challenge sharing
letsencrypt_mount_enabled: true
letsencrypt_host_path: /etc/letsencrypt
letsencrypt_container_path: /etc/letsencrypt
acme_webroot_host_path: /var/www/letsencrypt
acme_webroot_container_path: /var/www/letsencrypt

# Optional mount for sharing an nginx auth file with the container.
auth_file_host_path: ''
auth_file_container_path: /etc/nginx/auth

# Healthcheck path exposed by the container
healthcheck_path: /health
