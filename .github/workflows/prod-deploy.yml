name: prod build and deploy

on:
  push:
    branches: [ prod ]
    paths:
      - 'site-output/**'
      - 'Dockerfile'
      - 'nginx/**'
      - 'ansible/**'
      - '.github/workflows/prod-deploy.yml'
      - 'static-sitegen/**'
      - 'build-site.sh'
  # Enable manual triggering
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
  REGISTRY_NAMESPACE: ${{ secrets.REGISTRY_NAMESPACE }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  IMAGE_TAG: prod
  NODE_OPTIONS: --max-old-space-size=8192
  CI_KNOWN_HOSTS: ${{ secrets.CI_KNOWN_HOSTS }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
    outputs:
      registry_host: ${{ steps.normalize-registry.outputs.host }}
    steps:
      - name: Install SSH client (if missing)
        run: |
          set -e
          if ! command -v ssh-keyscan >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends openssh-client
          fi

      - name: Prepare SSH for Gitea
        env:
          CI_DEPLOY_KEY: ${{ secrets.CI_DEPLOY_KEY }}
          CI_KNOWN_HOSTS: ${{ env.CI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${CI_DEPLOY_KEY:-}" ]; then
            echo "CI_DEPLOY_KEY secret is required for prod checkout" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          CI_KEY_PATH="$HOME/.ssh/id_ci"
          printf "%s\n" "${CI_DEPLOY_KEY}" > "${CI_KEY_PATH}"
          chmod 600 "${CI_KEY_PATH}"
          if [ -n "${CI_KNOWN_HOSTS:-}" ]; then
            printf "%s\n" "${CI_KNOWN_HOSTS}" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p 2222 gitea-ssh.git-local.svc.cluster.local > "$HOME/.ssh/known_hosts"
          fi
          chmod 644 "$HOME/.ssh/known_hosts"
          {
            echo "Host gitea-ssh.git-local.svc.cluster.local"
            echo "  User git"
            echo "  IdentityFile ~/.ssh/id_ci"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >> "$HOME/.ssh/config"
          FINGERPRINT=$(ssh-keygen -E sha256 -lf "${CI_KEY_PATH}" | awk '{print $2}')
          echo "CI deploy key fingerprint (sha256): ${FINGERPRINT}"

      - name: Start SSH agent
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/id_ci"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Checkout repository (SSH)
        env:
          REPO_SSH: ssh://git@gitea-ssh.git-local.svc.cluster.local:2222/${{ github.repository }}.git
        run: |
          set -euo pipefail
          TARGET_REF="${GITHUB_REF:-}"
          if [[ "$TARGET_REF" == refs/heads/* ]]; then
            git clone --branch "${TARGET_REF#refs/heads/}" "$REPO_SSH" .
          elif [[ "$TARGET_REF" == refs/tags/* ]]; then
            TAG="${TARGET_REF#refs/tags/}"
            git clone "$REPO_SSH" .
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG" || git fetch origin "refs/tags/$TAG"
            git checkout "tags/$TAG"
          elif [[ "$TARGET_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git clone "$REPO_SSH" .
            git fetch origin "$TARGET_REF" || git fetch origin
            git checkout --detach "$TARGET_REF"
          elif [[ -n "$TARGET_REF" ]]; then
            git clone --branch "$TARGET_REF" "$REPO_SSH" . || {
              git clone "$REPO_SSH" .
              git fetch origin "$TARGET_REF" || true
              git checkout --detach "$TARGET_REF" || git checkout "$TARGET_REF" || true
            }
          else
            git clone "$REPO_SSH" .
          fi
          if [ -n "${GITHUB_SHA:-}" ]; then
            git fetch origin "${GITHUB_SHA}" || git fetch origin
            git checkout --detach "${GITHUB_SHA}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Smoke build static bundle
        env:
          SYNC_GIT_MANIFEST_URL_REWRITE: ssh://git@gitea.core.home.arpa:32222/=>ssh://git@gitea-ssh.git-local.svc.cluster.local:2222/
        run: ./build-site.sh


      - name: Normalize registry host
        id: normalize-registry
        run: |
          HOST="${REGISTRY_HOST:-}"
          if [ -z "$HOST" ]; then
            HOST="ghcr.io"
          fi
          if [ "$HOST" = "reg.microk8s.core.home.arpa:32000" ]; then
            echo "::warning::REGISTRY_HOST secret points to the lab-only MicroK8s registry. Overriding to ghcr.io for prod deploys."
            HOST="ghcr.io"
          fi
          echo "Using registry host: $HOST"
          echo "REGISTRY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -n "${REGISTRY_NAMESPACE}" ]; then
            REGISTRY_PATH="${REGISTRY_HOST}/${REGISTRY_NAMESPACE}"
          else
            REGISTRY_PATH="${REGISTRY_HOST}"
          fi
          echo "short=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "registry_path=${REGISTRY_PATH}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REGISTRY_PATH}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          no-cache: true
          ssh: |
            default
          build-args: |
            SYNC_GIT_MANIFEST_URL_REWRITE=ssh://git@gitea.core.home.arpa:32222/=>ssh://git@gitea-ssh.git-local.svc.cluster.local:2222/
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}:${{ env.IMAGE_TAG }}
            ${{ steps.meta.outputs.image_ref }}:${{ env.IMAGE_TAG }}-${{ steps.meta.outputs.short }}
          secrets: |
            ssh_known_hosts=${{ env.CI_KNOWN_HOSTS }}

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'
    needs: build
    env:
      REGISTRY_HOST: ${{ needs.build.outputs.registry_host }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Install SSH client (if missing)
        run: |
          set -e
          if ! command -v ssh-keyscan >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends openssh-client
          fi

      - name: Prepare SSH for Gitea
        env:
          CI_DEPLOY_KEY: ${{ secrets.CI_DEPLOY_KEY }}
          CI_KNOWN_HOSTS: ${{ env.CI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${CI_DEPLOY_KEY:-}" ]; then
            echo "CI_DEPLOY_KEY secret is required for prod checkout" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          CI_KEY_PATH="$HOME/.ssh/id_ci"
          printf "%s\n" "${CI_DEPLOY_KEY}" > "${CI_KEY_PATH}"
          chmod 600 "${CI_KEY_PATH}"
          if [ -n "${CI_KNOWN_HOSTS:-}" ]; then
            printf "%s\n" "${CI_KNOWN_HOSTS}" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p 2222 gitea-ssh.git-local.svc.cluster.local > "$HOME/.ssh/known_hosts"
          fi
          chmod 644 "$HOME/.ssh/known_hosts"
          {
            echo "Host gitea-ssh.git-local.svc.cluster.local"
            echo "  User git"
            echo "  IdentityFile ~/.ssh/id_ci"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >> "$HOME/.ssh/config"
          FINGERPRINT=$(ssh-keygen -E sha256 -lf "${CI_KEY_PATH}" | awk '{print $2}')
          echo "CI deploy key fingerprint (sha256): ${FINGERPRINT}"

      - name: Checkout repository (SSH)
        env:
          REPO_SSH: ssh://git@gitea-ssh.git-local.svc.cluster.local:2222/${{ github.repository }}.git
        run: |
          set -euo pipefail
          TARGET_REF="${GITHUB_REF:-}"
          if [[ "$TARGET_REF" == refs/heads/* ]]; then
            git clone --branch "${TARGET_REF#refs/heads/}" "$REPO_SSH" .
          else
            git clone "$REPO_SSH" .
          fi
          if [ -n "${GITHUB_SHA:-}" ]; then
            git fetch origin "${GITHUB_SHA}"
            git checkout --detach "${GITHUB_SHA}"
          fi

      - name: Install Ansible
        run: |
          set -euo pipefail
          python3 -m venv ~/.ansible-venv
          echo "$HOME/.ansible-venv/bin" >> "$GITHUB_PATH"
          source ~/.ansible-venv/bin/activate
          export PIP_NO_CACHE_DIR=1
          # Build a temporary CA bundle that keeps both system CAs and the runner-provided root.
          CA_BUNDLE_PATH="$(mktemp)"
          SYSTEM_CA_BUNDLE="/etc/ssl/certs/ca-certificates.crt"
          if [ -f "$SYSTEM_CA_BUNDLE" ]; then
            cat "$SYSTEM_CA_BUNDLE" > "$CA_BUNDLE_PATH"
            if [ -n "${SSL_CERT_FILE:-}" ] && [ -f "$SSL_CERT_FILE" ]; then
              cat "$SSL_CERT_FILE" >> "$CA_BUNDLE_PATH"
            fi
            export SSL_CERT_FILE="$CA_BUNDLE_PATH"
            export REQUESTS_CA_BUNDLE="$CA_BUNDLE_PATH"
            export CURL_CA_BUNDLE="$CA_BUNDLE_PATH"
          fi
          python -m pip install --upgrade pip
          pip install "ansible>=9.1" "docker" "jmespath"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          KEY_PATH="$HOME/.ssh/gitea-ci-prod"
          printf "%s" "$SSH_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "KNOWN_HOSTS secret empty; discovering fingerprint via ssh-keyscan." >&2
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts
          else
            printf "%s\n" "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi

      - name: Deploy with Ansible
        working-directory: ansible
        env:
          ANSIBLE_FORCE_COLOR: '1'
        run: |
          ansible-playbook -i inventory/hosts.ini deploy.yml \
            -e "ansible_host=${VPS_HOST}" \
            -e "ansible_user=${VPS_USER}" \
            -e "image_registry=${REGISTRY_HOST}" \
            -e "image_namespace=${REGISTRY_NAMESPACE}" \
            -e "image_name=${IMAGE_NAME}" \
            -e "image_tag=${IMAGE_TAG}" \
            -e "registry_username=${REGISTRY_USERNAME}" \
            -e "registry_password=${REGISTRY_PASSWORD}"
