name: Build & Push (dev / site-output)

on:
  push:
    branches: [ dev ]
    paths: [ 'site-output/**' ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: reg.microk8s.core.home.arpa:32000
      IMAGE_NAME: cm
      TAG_SHA: dev-${{ gitea.sha.substr(0,7) }}
      TAG_MAJOR: latest

    steps:
      - name: Debug secrets presence (no contents)
        run: |
          test -n "${{ secrets.CI_DEPLOY_KEY }}" && echo "CI_DEPLOY_KEY: present" || (echo "CI_DEPLOY_KEY: MISSING" && exit 1)
          test -n "${{ secrets.CI_KNOWN_HOSTS }}" && echo "CI_KNOWN_HOSTS: present" || (echo "CI_KNOWN_HOSTS: MISSING" && exit 1)

      - name: Setup SSH for clone
        run: |
          install -m 700 -d ~/.ssh
          printf "%s\n" "${{ secrets.CI_DEPLOY_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          # Use the port your clients will hit. External example (32222):
          printf "%s\n" "${{ secrets.CI_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Clone repo (SSH, explicit port)
        run: |
          # Choose ONE of the two, whichever is reachable from the runner:

          # 1) External/LAN address via router/NAT (your helm shows SSH_PORT 32222):
          REPO_SSH="ssh://git@gitea.core.home.arpa:32222/m4xx3d0ut/chaosandmajesty-static-site-gen.git"

          # 2) In-cluster service (if you have a ClusterIP for gitea), avoids router/DNSMasq entirely:
          # REPO_SSH="ssh://git@gitea.git-local.svc.cluster.local:2222/m4xx3d0ut/chaosandmajesty-static-site-gen.git"
          git clone --depth 1 --branch dev "$REPO_SSH" .

      - name: Registry login (optional)
        if: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_MAJOR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image refs
        run: |
          echo "Pushed:"
          echo "  ${REGISTRY}/${IMAGE_NAME}:${TAG_SHA}"
          echo "  ${REGISTRY}/${IMAGE_NAME}:${TAG_MAJOR}"

