services:
  cm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGINX_CONFIG: nginx/default.dev.conf
    container_name: cm-local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
