server {
    listen 8080;
    server_name cosmosmechane.com www.cosmosmechane.com cosmec.co www.cosmec.co;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 8443 ssl http2;
    server_name cosmosmechane.com www.cosmosmechane.com cosmec.co www.cosmec.co;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;
    port_in_redirect off;

    ssl_certificate /etc/letsencrypt/live/cosmosmechane.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cosmosmechane.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
