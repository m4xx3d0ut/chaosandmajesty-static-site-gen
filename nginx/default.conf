server {
    listen 8080;
    server_name chaosandmajesty.com www.chaosandmajesty.com;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /sse/feeds {
        proxy_pass http://rss-proxy:7070/sse/feeds;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/git/([^/]+)/$ {
        return 301 /git/$1.git/;
    }

    location ~ ^/git/([^/]+)$ {
        return 301 /git/$1.git;
    }

    location ~ ^/git/(?![^/]+\.git(/|$))(?<repo>[^/]+)/(?<rest>(?:info|objects)/.*|HEAD|git-(?:upload|receive)-pack)$ {
        return 307 /git/$repo.git/$rest$is_args$args;
    }

    location ~ ^/git/(.+\.git)(/.*)?$ {
        root /usr/share/nginx/html;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /git {
        return 301 /git/;
    }

    location /git/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        allow all;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 8443 ssl http2;
    server_name chaosandmajesty.com www.chaosandmajesty.com;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;
    port_in_redirect off;

    ssl_certificate /etc/letsencrypt/live/chaosandmajesty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chaosandmajesty.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/git/([^/]+)/$ {
        return 301 /git/$1.git/;
    }

    location ~ ^/git/([^/]+)$ {
        return 301 /git/$1.git;
    }

    location ~ ^/git/(?![^/]+\.git(/|$))(?<repo>[^/]+)/(?<rest>(?:info|objects)/.*|HEAD|git-(?:upload|receive)-pack)$ {
        rewrite ^ /git/$repo.git/$rest$is_args$args last;
    }

    location ~ ^/git/(.+\.git)(/.*)?$ {
        root /usr/share/nginx/html;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /git {
        return 301 /git/;
    }

    location /git/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        allow all;
    }

    location /dav {
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_access user:rw group:rw all:rw;
        create_full_put_path on;
        client_max_body_size 0;
        client_body_temp_path /tmp/webdav;

        auth_basic "Core";
        auth_basic_user_file /etc/nginx/auth/webdav;
    }
}
