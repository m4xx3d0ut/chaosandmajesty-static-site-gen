server {
    listen 8080;
    server_name chaosandmajesty.com www.chaosandmajesty.com;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /sse/feeds {
        # Defer DNS so the container can boot without rss-proxy present.
        set $rss_proxy_upstream rss-proxy:7070;
        resolver 127.0.0.11 10.152.183.10 valid=30s ipv6=off;
        resolver_timeout 5s;
        proxy_pass http://$rss_proxy_upstream/sse/feeds;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/git/([^/]+)/$ {
        return 301 /git/$1.git/;
    }

    location ~ ^/git/([^/]+)$ {
        return 301 /git/$1.git;
    }

    location ~ ^/git/(?![^/]+\.git(/|$))(?<repo>[^/]+)/(?<rest>(?:info|objects)/.*|HEAD|git-(?:upload|receive)-pack)$ {
        return 307 /git/$repo.git/$rest$is_args$args;
    }

    location ~ ^/git/(.+\.git)(/.*)?$ {
        root /usr/share/nginx/html;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /git {
        return 301 /git/;
    }

    location /git/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
