  # Content styling
  contentFont: "modern-mono" # Options: terminal, modern-mono, system-mono
  terminalStyle: true # Adds terminal-like styling with cursor and scanlines

  tagline: "These are not the droids you are looking for..."
  # mainImage: "assets/static/img/bunny-punx.webp"
  # mainImageAlt: "Punks not dead"
  footerText: "Warning! Chaosandmajesty.com accepts no responsibility for your interactions with WOPR."

  rssWidget:
    enabled: true
    feedUrl: "feeds/combined.json"
    sseUrl: "/sse/feeds"
    defaultSource: "all"
    pageSize: 6
    sort: "date"
    openInNewTab: true
    showSearch: true
    showTags: true
    showSources: true

  content: |

    <br>

    ## Welcome to Chaos & Majesty!

    <br>

    Welcome to our corner of the internet—where we publish ideas, prototypes, and notes from the workbench. It’s a place to share what we’re learning, ship projects in the open, and build a small archive that may be useful to others.

    If you like to read code alongside the writing, check out the site’s Git mirror. The site is open source, and so is the generator that powers it. You’re encouraged to fork it, break it, improve it, and make it yours.

    We built the site on RadioStatic, our lightweight static generator that uses HTMX to make things feel interactive without turning the whole thing into an app. Everything is pre-rendered; the “dynamic” pieces are just static fragments. In practice, that means deterministic builds, fewer runtime dependencies, a smaller blast radius, and a surface area you can actually reason about.

    …also: you can play DOOM on it.

    <br>

    \- ***m4xx3d0ut*** & ***ReneéRules***

    <br>

