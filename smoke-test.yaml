  postTemplate: blog/post.ejs
  fragmentTemplate: blog/fragment.ejs
  index:
    heroTitle: "Chaos & Majesty Journal"
    heroTagline: "Dispatches from the underground console"
    intro: |
      Terminal-born perspectives on building the experience.
      Read the latest dispatches from Chaos and Majesty without leaving the console.
    useCmHead: true
    useCmFooter: true
    cmImage: "assets/static/img/bunny-punx.webp"
    renderInitialPost: true
    sidebarPageSize: 6
    defaultPostPath: content/blog/default-post.md

  authors:
