pages:
  - title: Git
    slug: git
    template: git.ejs
    useCmHead: true
    useCmFooter: true
    hideTitle: true
    git:
      intro: |
        <p>Browse the Core Git front door without leaving the site. Pick a repository on the left; the activity feed loads on the right.</p>
      repoIndexUrl: "https://cm.core.home.arpa/git/"
      manifest: "config/stagit/manifest.txt"
      defaultRepoLabel: "chaosandmajesty-static-site-gen"
      repoDetailSuffix: "log.html"
      leftPaneTitle: "Core Git"
      leftPaneDescription: "Select a repository from the Core Git catalog (hydrated from config/stagit/manifest.txt)."
      rightPaneTitle: "Repository Activity"
      rightPaneDescription: "Commit history, files, README, and refs render inline from the build-time mirrors."
      localRepoOverrides:
        chaosandmajesty-static-site-gen: .

